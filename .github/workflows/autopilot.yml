# After uploading, rename this file to:  .github/workflows/autopilot.yml
name: autopilot
on:
  schedule:
    - cron: "30 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - run: python autopilot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE }}
          CONTENT_LANG: ${{ vars.CONTENT_LANG }}
          NICHE_HINT: ${{ vars.NICHE_HINT }}
          RUN_BOTH: ${{ vars.RUN_BOTH }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME }}
          SFX_VOLUME: ${{ vars.SFX_VOLUME }}
          USE_LYRIA: ${{ vars.USE_LYRIA }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: |
            work_short/final.mp4
            work_long/final.mp4
          retention-days: 2
          if-no-files-found: ignore
      - name: save history and dashboard data
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add history.json data.json
          git commit -m "update" || echo "nothing"
          git pull --rebase || true
          git push || true
